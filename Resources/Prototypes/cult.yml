# ==========================================
# ДАРЫ
# ==========================================

- type: entity
  name: Дар Защиты Тайного Короля
  description: Дар Тайного Короля, надеваемый на шею, который защитит тебя. Использует батарейки.
  suffix: HiddenKingCult
  id: HydinKingGiftofProtection
  parent: [ BaseItem, BaseSyndicateContraband ]
  components:
  - type: Item
    size: Ginormous
  - type: Clothing
    quickEquip: false
    slots:
    - Neck
  - type: Sprite
    sprite: _Sunrise/Objects/Tools/EnergyDome/syndie.rsi
    layers:
      - state: icon
  - type: ContainerContainer
    containers:
      cell_slot: !type:ContainerSlot
  - type: PowerCellSlot
    cellSlotId: cell_slot
  - type: ItemSlots
    slots:
      cell_slot:
        name: power-cell-slot-component-slot-name-default
        startingItem: PowerCellSyndicate
        whitelist:
          tags:
            - PowerCell
  - type: EnergyDomeGenerator
    damageEnergyDraw: 3
    domePrototype: EnergyDomeSmallRed
  - type: PowerCellDraw
    drawRate: 10
    useCharge: 1
  - type: UseDelay
    delay: 10.0

- type: entity
  parent: BaseSubdermalImplant
  id: HydinKingGiftofRegeneration
  name: дар регенерации Тайного Короля
  description: Дар Тайного Короля лечит вас.
  suffix: HiddenKingCult
  components:
  - type: Sprite
    sprite: _Sunrise/Entities/Objects/Implants/implants.rsi
    state: inject_implant_red
  - type: SubdermalImplant
    implantAction: ActionActivateEmpImplantHydinKingGiftofRegeneration
  - type: TriggerOnActivateImplant
  - type: TriggerOnMobstateChange
    mobState:
    - Critical
  - type: AddSolutionOnTrigger
    solution: bloodstream
    targetUser: true
    addedSolution:
      reagents:
      - ReagentId: Omnizine
        Quantity: 30
      - ReagentId: Saline
        Quantity: 15

- type: entity
  parent: BaseSubdermalImplant
  id: HydinKingGiftofShelter
  name: Дар Укрытия Тайного Короля
  description: Даёт шанс уйти от погони, используя карманный Портал.
  suffix: HiddenKingCult
  components:
  - type: SubdermalImplant
    implantAction: ActionActivateHydinKingGiftofShelter
  - type: TriggerOnActivateImplant
  - type: ScramOnTrigger
    targetUser: true

- type: entity
  parent: BaseSubdermalImplant
  id: HiddenKingatEMI
  name: Дар ЭМИ Тайного Короля
  description: Обесточивает электричество в небольшом радиусе.
  suffix: HiddenKingCult
  components:
  - type: SubdermalImplant
    implantAction: ActionActivateEmpImplantHiddenKingatEMI
  - type: TriggerOnActivateImplant
  - type: EmpOnTrigger
    range: 2.30
    energyConsumption: 50000
    disableDuration: 10

# ==========================================
# АКТИВ ДАРОВ (ACTION)
# ==========================================

- type: entity
  parent: BaseImplantAction
  id: ActionActivateEmpImplantHydinKingGiftofRegeneration
  name: дар регенерации Тайного Короля
  description: Дар Тайного Короля лечит вас.
  components:
  - type: LimitedCharges
    maxCharges: 2
  - type: AutoRecharge
    rechargeDuration: 240
  - type: Action
    checkCanInteract: false
    useDelay: 10
    itemIconStyle: BigAction
    priority: -20
    icon:
      sprite: Objects/Weapons/Grenades/empgrenade.rsi
      state: icon

- type: entity
  parent: ActionActivateEmpImplant
  id: ActionActivateEmpImplantHiddenKingatEMI
  name: дар ЭМИ Тайного Короля
  description: Обесточивает электричество в небольшом радиусе.
  suffix: HiddenKingCult
  components:
  - type: LimitedCharges
    maxCharges: 1
  - type: AutoRecharge
    rechargeDuration: 60
  - type: Action
    checkCanInteract: false
    useDelay: 1
    itemIconStyle: BigAction
    icon:
      sprite: Objects/Weapons/Bombs/c4.rsi
      state: icon

- type: entity
  parent: BaseImplantAction
  id: ActionActivateHydinKingGiftofShelter
  name: дар Укрытия Тайного Короля
  description: Даёт шанс уйти от погони, используя карманный Портал.
  components:
  - type: LimitedCharges
    maxCharges: 1
  - type: AutoRecharge
    rechargeDuration: 240
  - type: Action
    checkCanInteract: false
    useDelay: 1
    itemIconStyle: BigAction
    icon:
      sprite: Structures/Specific/anomaly.rsi
      state: anom4

# Плющки

- type: entity
  id: MirrorShieldOfTheHiddenKing
  parent: BaseShield
  name: зеркальный щит Покровенного Царя
  description: Щит с зеркалом на передней стороне, на котором выгравирован символ Покровенного Царя. Создан для защиты и отражения атак.
  suffix: HiddenKingCult
  components:
  - type: Sprite
    sprite: _Sunrise/BloodCult/Entities/mirror_shield.rsi
    state: icon
  - type: Item
    sprite: _Sunrise/BloodCult/Entities/mirror_shield.rsi
    heldPrefix: "mirror"
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 300
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: Reflect
    reflectProb: 0.5
    reflects:
    - Energy
    - NonEnergy
  - type: ReturnItemOnThrow
  - type: CultMirrorShield
  - type: Blocking
    passiveBlockModifier:
      coefficients:
        Blunt: 0.8
        Slash: 0.8
        Piercing: 0.8
        Heat: 0.6
    activeBlockModifier:
      coefficients:
        Blunt: 0.6
        Slash: 0.6
        Piercing: 0.6
        Heat: 0.4
      flatReductions:
        Heat: 1
        Piercing: 1

- type: entity
  name: очки ночного зрения Покровенного Царя
  id: HiddenKingCultNightVisionGoggles
  parent: [BaseNightVisionDevice]
  description: Ночные очки, изготовленные из материала, поглощающего свет. Обеспечивают изображение местности в условиях низкой освещенности. Созданы для ночного видения и скрытных операций.
  suffix: HiddenKingCult
  components:
  - type: Sprite
    sprite: _Sunrise/Clothing/Eyes/Glasses/nvd.rsi
    layers:
      - state: icon
      - state: icon-flash
        visible: false
        shader: unshaded
        map: [ "light" ]
  - type: Clothing
    sprite: _Sunrise/Clothing/Eyes/Glasses/nvd.rsi
    quickEquip: true
    slots: [ Eyes ]
    clothingVisuals:
      eyes:
      - state: off-equipped-EYES
  - type: ItemToggle
    predictable: false
    onUse: false
    canActivateInhand: false
    soundActivate:
      path: /Audio/_Sunrise/Items/Goggles/activate.ogg
    soundDeactivate:
      path: /Audio/_Sunrise/Items/Goggles/deactivate.ogg
    soundFailToActivate:
      path: /Audio/Machines/button.ogg
  - type: ToggleableVisuals
    spriteLayer: light
    clothingVisuals:
      eyes:
      - state: on-equipped-EYES
        shader: unshaded
  - type: ToggleCellDraw
  - type: HideLayerClothing
    layers:
      Hair: HEAD
  - type: Tag
    tags:
    - NightVisionDevice

- type: entity
  parent: [BaseItem, BaseSyndicateContraband]
  id: HiddenKingCultPowerDisruptorTablet
  name: скрижаль перебоя электричества Покровенного Царя
  description: Одноразовое устройство, которое принудительно запускает проверку электрической сети станции, временно отключая электричество на всей станции. Создано для использования в ритуалах культистов.
  suffix: HiddenKingCult
  components:
  - type: Sprite
    sprite: Objects/Devices/declaration_of_war.rsi
    layers:
    - state: declarator
  - type: Item
  - type: TriggerOnUse
  - type: AddGameRuleOnTrigger
    gameRule: BreakerFlip
  - type: DeleteOnTrigger

- type: entity
  parent: [BaseItem, BaseSyndicateContraband]
  id: HiddenKingCultMeteorStormTablet
  name: скрижаль метеоров Покровенного Царя
  description: Одноразовое устройство, которое сигнализирует спутникам Синдиката о том, чтобы они сдвинули небольшую часть метеоритов в секторе. Активация вызовет метеоритный шторм вокруг станции. Создано для использования в ритуалах культистов.
  suffix: HiddenKingCult
  components:
  - type: Sprite
    sprite: Objects/Devices/declaration_of_war.rsi
    layers:
    - state: declarator
  - type: Item
  - type: TriggerOnUse
  - type: SpawnEntityTableOnTrigger
    table: !type:AllSelector
      children:
      - id: SunriseMeteorSwarmMediumRuleTrigger
      - id: SunriseSpaceDustMinorRuleTrigger
      - id: SunriseSpaceDustMinorSecondRuleTrigger
  - type: DeleteOnTrigger

