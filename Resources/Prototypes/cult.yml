- type: entity
  parent: BaseMob
  id: MobHiddenKing
  name: Тайный Король
  suffix: HiddenKingCult
  components:
  - type: AnnounceOnSpawn
    message: Тайный Король явился в этот мир!
    sender: Покровенный Царь
    sound:
      path: /Audio/Misc/narsie_rises.ogg
    color: red
  - type: CargoSellBlacklist
  - type: RandomWalk
    minSpeed: 10
    maxSpeed: 20
    minStepCooldown: 1
    maxStepCooldown: 2
  - type: ContentEye
    maxZoom: 2.0,2.0
  - type: Input
    context: "ghost"
  - type: MovementIgnoreGravity
  - type: IntrinsicRadioReceiver
  - type: ActiveRadio
    channels:
    - Binary
    - Common
    - Command
    - CentCom
    - Engineering
    - Medical
    - Science
    - Security
    - Service
    - Supply
    - Syndicate
    globalReceive: true
  - type: Physics
    bodyStatus: InAir
  - type: CanMoveInAir
  - type: Sprite
    sprite: Mobs/Demons/narsie.rsi
    drawdepth: Ghosts
    scale: 2.0,2.0
    layers:
    - state: narsie
      shader: unshaded
    - type: AmbientSound
      volume: 9
      range: 13
      enabled: true
      sound:
        path: /Audio/_Sunrise/BloodCult/narsie_summoned.ogg

