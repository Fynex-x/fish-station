# АЛТАРЬ ПРИЗЫВА
# ==========================================

- type: entity
  id: PirateTechFabCircuitboardHiddenKingCultFilled
  parent: BaseMachineCircuitboard
  name: скрижаль призыва
  description: A machine printed circuit board for an pirate techfab.
  suffix: HiddenKingCult
  components:
    - type: Sprite
      sprite: _Sunrise/Objects/Misc/module.rsi
      state: pirate_stitcher
    - type: Item
      storedRotation: -90
    - type: MachineBoard
      prototype: PirateTechFabHiddenKingCultFilled
      stackRequirements:
        TabletHiddenKing: 2

- type: entity
  id: PirateTechFabHiddenKingCultFilled
  parent: [ ConstructibleMachine ]
  name: магический алтарь призыва Покровенного Царя
  suffix: HiddenKingCult
  description: Древний алтарь, предназначенный для проведения темных ритуалов и призыва Тайного Короля.
  placement:
    mode: SnapgridCenter
  components:
    - type: AnnounceOnSpawn
      message: КАРОЧЕ СТАНЦИЯ ВЫ ОЧЕНЬ СИЛЬНО ОБЛОЖАЛИСЬ
      sender: Отдел Центрального Командования по делам высших измерений
      sound:
        path: /Audio/_Fish/StationEvents/level.ogg
      color: red
    - type: Transform
      anchored: true
      noRot: false
    - type: Physics
      bodyType: Static
    - type: Fixtures
      fixtures:
        fix1:
          shape:
            !type:PhysShapeAabb
            bounds: -0.25,-0.5,0.25,0.5
          density: 190
          mask:
          - MachineMask
          layer:
          - MachineLayer
    - type: Clickable
    - type: InteractionOutline
    - type: Anchorable
    - type: Rotatable
    - type: Injurable
      damageContainer: StructuralInorganic
    - type: Damageable
      damageModifierSet: Metallic
    - type: Destructible
      thresholds:
      - trigger:
          !type:DamageTrigger
          damage: 200
        behaviors:
        - !type:PlaySoundBehavior
          sound:
            collection: MetalBreak
        - !type:DoActsBehavior
          acts: ["Destruction"]
      - trigger:
          !type:DamageTrigger
          damage: 100
        behaviors:
        - !type:PlaySoundBehavior
          sound:
            collection: MetalBreak
        - !type:DoActsBehavior
          acts: ["Destruction"]
    - type: Pullable
      bodyType: Static
    - type: Sprite
      sprite: Structures/Furniture/Altars/Cults/fangs.rsi
      state: full
    - type: Icon
      sprite: Structures/Furniture/Altars/Cults/fangs.rsi
      state: full
    - type: Machine
      board: PirateTechFabCircuitboardHiddenKingCultFilled
